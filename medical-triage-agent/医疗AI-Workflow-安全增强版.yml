    - id: '1790000000014'
      type: custom
      data:
        title: ⑫ 输出安全层：免责声明 + 禁用表述过滤
        desc: 正则拦截诊断性表述/用药推荐/剂量描述/绝对化承诺；通过校验则强制追加免责声明
        code_language: python3
        code: "\nimport re\n\n# 合规红线：出现以下任一表述即判定为不合规\nBANNED_PATTERNS = [\n    (r\"建议(服用|口服|使用|吃点|去打|注射)[\\u4e00-\\u9fa5A-Za-z0-9]{1,12}\", \"用药推荐\"),\n    (r\"(每日|每天|一天|一次)\\s*[0-9０-９]+\\s*(次|片|粒|mg|毫克|毫升|ml)\", \"剂量描述\"),\n    (r\"(确诊为|诊断为|你患有|您患有|您得了|你得了|应该是|肯定是)[\\u4e00-\\u9fa5]{2,14}\", \"诊断性表述\"),\n    (r\"(不用去医院|无需就医|不必就诊|不用看医生|自己在家处理)\", \"误导性建议\"),\n    (r\"(包治|根治|一定能治好|绝对安全|保证痊愈)\", \"绝对化承诺\"),\n    (r\"(处方|开药给你|按这个方子)\", \"处方性表述\"),\n]\n\nDISCLAIMER = (\n    \"\\n\\n————————————\\n\"\n    \"【免责声明】以上内容仅为健康科普与就诊指引，不构成任何医疗诊断、用药建议或治疗方案。\"\n    \"AI 无法替代医生面诊，请以执业医师的诊断结论为准。\"\n    \"如症状持续、加重或出现紧急情况，请立即前往医院急诊科或拨打 120。\"\n)\n\n\ndef main(draft_answer: str, pii_masked: str) -> dict:\n    text = (draft_answer or \"\").strip()\n\n    # 0. 剥离模型思维链标签（部分模型会把推理过程一并输出，绝不能展示给患者）\n    text = re.sub(r\"<think[\\s\\S]*?</think\\s*>\", \"\", text, flags=re.IGNORECASE)\n    text = re.sub(r\"<thinking[\\s\\S]*?</thinking\\s*>\", \"\", text, flags=re.IGNORECASE)\n    text = re.sub(r\"</?think\\s*>\", \"\", text, flags=re.IGNORECASE)\n    text = re.sub(r\"【思考】[\\s\\S]*?【/思考】\", \"\", text)\n    text = text.strip()\n\n    hits = []\n    for pattern, label in BANNED_PATTERNS:\n        m = re.search(pattern, text)\n        if m:\n            hits.append(\"%s：「%s」\" % (label, m.group(0)))\n\n    if not hits:\n        final = text + DISCLAIMER\n        is_compliant = \"是\"\n        detail = \"无\"\n    else:\n        final = (\n            \"为保障医疗安全，本次回答未通过内容合规校验，已被系统拦截。\\n\\n\"\n            \"该回答中出现了超越平台边界的表述（可能涉及诊断结论或用药建议），\"\n            \"出于安全考虑不向用户展示。\\n\\n\"\n            \"建议您：\\n\"\n            \"1. 前往对应科室面诊，由执业医师给出诊断；\\n\"\n            \"2. 如需用药指导，请咨询医生或执业药师；\\n\"\n            \"3. 如症状持续或加重，请及时就医；出现紧急情况请立即拨打 120。\\n\\n\"\n        )\n        if pii_masked and pii_masked != \"无\":\n            final += \"（提示：本次提问中的敏感信息已自动脱敏：%s）\\n\" % pii_masked\n        is_compliant = \"否\"\n        detail = \"；\".join(hits)\n\n    return {\n        \"final_answer\": final,\n        \"is_compliant\": is_compliant,\n        \"violation_detail\": detail,\n    }\n"
        variables:
        - variable: draft_answer
          value_selector:
          - '1790000000013'
          - output
          value_type: string
        - variable: pii_masked
          value_selector:
          - '1790000000002'
          - pii_masked
          value_type: string
        outputs:
          final_answer:
            type: string
            children: null
          is_compliant:
            type: string
            children: null
          violation_detail:
            type: string
            children: null
        retry_config:
          retry_enabled: true
          max_retries: 2
          retry_interval: 1000
        type: code
        selected: false
      position:
        x: 300
        y: 1700
