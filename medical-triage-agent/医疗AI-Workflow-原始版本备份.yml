      data:
        code: "\ndef symptom_branch(main_symptom):\n    raw_input = main_symptom\n    result = \"\"\n    critical_set = {\"胸闷\", \"呼吸困难\", \"大出血\", \"意识丧失\"}\n\n    if main_symptom == \"闲聊\":\n        result = \"你好，我是医疗AI-workflow小助手，本平台暂不支持闲聊功能，敬请谅解。\"\n    elif main_symptom in critical_set:\n        result = \"立即拨打120，就近急\"\n    else:\n        result = main_symptom\n\n    return result, raw_input\n\n\nif __name__ == \"__main__\":\n    test_cases = [\n        \"闲聊\",\n        \"胸闷\",\n        \"咳嗽咳痰\",\n        \"意识丧失\",\n        \"头痛头晕\"\n    ]\n    for case in test_cases:\n        res, raw = symptom_branch(case)\n        print(f\"原始输入:{raw} → result:{res}\")\n"
        code_language: python3
